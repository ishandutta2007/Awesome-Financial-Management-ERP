<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    
    <!-- Dynamic Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 44px; fill: #ffffff; }
    .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 400; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
    .stat-val { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 22px; fill: #f8fafc; }
    .stat-lbl { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 12px; fill: #64748b; }
    
    /* Subtle background animations */
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.08); opacity: 0.6; }
      100% { transform: scale(1); opacity: 0.3; }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0px); }
    }
    
    .pulsing-orb { animation: pulse 6s infinite ease-in-out; transform-origin: center; }
    .animated-line { stroke-dasharray: 8 6; animation: dash 2s linear infinite; }
    .floating-card { animation: float 4s infinite ease-in-out; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>

  <!-- Background Decorative Glowing Orbs (Behind content) -->
  <circle cx="150" cy="80" r="140" fill="#0284c7" opacity="0.25" filter="url(#glow)" class="pulsing-orb" />
  <circle cx="1050" cy="220" r="160" fill="#6366f1" opacity="0.2" filter="url(#glow)" class="pulsing-orb" style="animation-delay: -3s;" />

  <!-- Background Dynamic Grid / Financial Wave Lines (Behind cards & text) -->
  <path d="M0,220 Q 300,160 600,240 T 1200,180" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.2" class="animated-line" />
  <path d="M0,240 Q 300,280 600,200 T 1200,230" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.15" />

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <!-- Foreground Title and Subtitle -->
  <g transform="translate(60, 85)">
    <!-- Category Pill Badge -->
    <rect x="0" y="0" width="230" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="16" cy="16" r="5" fill="#38bdf8"/>
    <text x="30" y="21" class="badge-text">CURATED AWESOME LIST</text>

    <!-- Main Title -->
    <text x="0" y="80" class="title">Awesome Financial Management ERP</text>

    <!-- Subtitle -->
    <text x="0" y="118" class="subtitle">General Ledger • Accounts Payable &amp; Receivable • Multi-Currency • Financial Close</text>
  </g>

  <!-- Side Floating Analytics / Stats Cards (Positioned safely to the right) -->
  <g transform="translate(850, 60)" class="floating-card">
    <!-- Card 1: Enterprise SaaS -->
    <rect x="0" y="0" width="280" height="75" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1" />
    <text x="20" y="34" class="stat-val">SaaS &amp; Open Source</text>
    <text x="20" y="55" class="stat-lbl">Enterprise &amp; SMB Financial Tech Stack</text>
    <circle cx="245" cy="38" r="16" fill="#38bdf8" opacity="0.15"/>
    <path d="M239,38 L243,42 L251,34" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <g transform="translate(850, 155)" class="floating-card" style="animation-delay: -2s;">
    <!-- Card 2: Market Context -->
    <rect x="0" y="0" width="280" height="75" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1" />
    <text x="20" y="34" class="stat-val">$30B+ Market</text>
    <text x="20" y="55" class="stat-lbl">Global Financial Management &amp; ERP</text>
    <circle cx="245" cy="38" r="16" fill="#c084fc" opacity="0.15"/>
    <path d="M240,43 L245,33 L250,38" fill="none" stroke="#c084fc" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
